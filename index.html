<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d8b58b"><title>Cap Stack Sort</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;touch-action:none}body{display:grid;place-items:center;background:#b78d64;font-family:Arial,sans-serif;user-select:none}.game{position:relative;width:min(100vw,calc(100svh*9/16));height:min(100svh,calc(100vw*16/9));overflow:hidden;background:linear-gradient(135deg,#d8b58b,#c89d70 45%,#dfc29b);box-shadow:0 20px 70px #0005}.game:before{content:"";position:absolute;inset:0;opacity:.18;background:repeating-linear-gradient(92deg,#fff0 0 48px,#6d452522 49px,#fff0 52px 104px)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hud{position:absolute;z-index:2;left:4%;right:4%;top:2.2%;display:flex;align-items:stretch;gap:2%;pointer-events:none}.logo{width:28%;font-weight:1000;font-size:clamp(18px,7cqw,34px);line-height:.78;color:#fff;text-shadow:0 4px 0 #153d75,0 7px 12px #0005;transform:rotate(-4deg)}.logo b{display:block;color:#ffd12d}.stats{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;background:#363636e8;color:#fff;border:2px solid #ffffff55;border-radius:12px;box-shadow:0 5px 14px #0003;overflow:hidden}.stat{display:grid;place-items:center;padding:4px;border-right:1px solid #ffffff55}.stat:last-child{border:0}.stat small{font-weight:800;color:#d7d7d7;font-size:clamp(8px,2.5cqw,13px)}.stat strong{font-size:clamp(15px,5cqw,27px);color:#ffd42c}.gear{position:absolute;z-index:3;right:3%;top:10.5%;width:10%;aspect-ratio:1;border:2px solid #ffffff99;border-radius:12px;background:#3c3c3ce8;color:white;font-size:6cqw;display:grid;place-items:center;box-shadow:0 4px 10px #0004}.tag{position:absolute;z-index:2;left:4%;top:13%;font-weight:900;font-size:2.5cqw;color:#493b30}.traylabel{position:absolute;z-index:2;right:4%;bottom:3.5%;font-weight:900;font-size:2.5cqw;color:#594536;text-align:center;pointer-events:none}.toast{position:absolute;z-index:5;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);opacity:0;color:white;font-weight:1000;font-size:9cqw;text-shadow:0 4px 0 #6d381c,0 8px 20px #0007;pointer-events:none}.toast.show{animation:toast .9s ease-out}.combo{color:#ffd632}.overlay{position:absolute;z-index:10;inset:0;display:none;place-items:center;background:#3c2b20cc;backdrop-filter:blur(5px);padding:8%}.overlay.show{display:grid}.card{width:100%;background:#f3e3cd;border-radius:22px;padding:8%;text-align:center;color:#493728;box-shadow:0 15px 50px #0005}.card h2{font-size:9cqw;margin:0 0 3%}.card button{border:0;background:#2f6d3e;color:white;font-weight:900;font-size:4cqw;padding:4% 9%;border-radius:14px}.hint{position:absolute;z-index:2;left:5%;bottom:2.5%;font-size:2.3cqw;font-weight:800;color:#5c4939;pointer-events:none}@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.16)}45%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(.92)}}
</style></head><body><main class="game" id="game"><canvas id="c" width="900" height="1600"></canvas><div class="hud"><div class="logo">CAP<b>STACK</b><span style="font-size:.62em">SORT</span></div><div class="stats"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>BEST</small><strong id="best">0</strong></div><div class="stat"><small>COMBO</small><strong id="combo">—</strong></div></div></div><button class="gear" id="sound">♫</button><div class="tag">SAME CAPS. BIGGER COMBOS.</div><div class="hint">DRAG A STACK • OR TAP, THEN TAP A SLOT</div><div class="traylabel">NEXT STACKS<br>DRAG OR TAP</div><div class="toast" id="toast"></div><div class="overlay" id="over"><div class="card"><h2>Nice run!</h2><p id="final"></p><button id="again">PLAY AGAIN</button></div></div></main>
<script>
'use strict';
const C=document.getElementById('c'),X=C.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),comboEl=document.getElementById('combo'),toast=document.getElementById('toast'),over=document.getElementById('over');
const W=900,H=1600,COLS=5,ROWS=6,THRESH=10;const TYPES=[{n:'COLA',b:'#df2d27',l:'#ff6a4f',d:'#8e1717'},{n:'FANTA',b:'#ff7b13',l:'#ffb43a',d:'#b44709'},{n:'7UP',b:'#1e9a4a',l:'#56c86d',d:'#09612d'},{n:'PEP',b:'#1658c7',l:'#4d8cff',d:'#08357e'},{n:'LEMON',b:'#f1c91e',l:'#ffe65b',d:'#a98200'},{n:'GRAPE',b:'#7b43b7',l:'#b276e9',d:'#4b2474'}];
let board,tray,score,best=+(localStorage.getItem('cap-best')||0),selected=null,drag=null,busy=false,started=0,soundOn=localStorage.getItem('cap-sound')!=='0',particles=[],rings=[],shake=0,flash=0,hover=-1,lastTray='';bestEl.textContent=best;
const bx=105,by=255,cw=138,ch=145,gap=13,boardW=COLS*cw+(COLS-1)*gap,boardH=ROWS*ch+(ROWS-1)*gap,ty=1355;
function top(s){return s?.length?s[s.length-1]:-1}function run(s){if(!s?.length)return 0;let t=top(s),i=s.length-1;while(i>=0&&s[i]===t)i--;return s.length-1-i}function neigh(i){let x=i%5,y=(i/5)|0,a=[];if(y)a.push(i-5);if(x)a.push(i-1);if(x<4)a.push(i+1);if(y<5)a.push(i+5);return a}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
class AudioFX{constructor(){this.ctx=null}on(){if(!soundOn)return false;this.ctx??=new (window.AudioContext||window.webkitAudioContext)();this.ctx.resume();return true}tone(f,d=.08,type='sine',v=.05,delay=0){if(!this.on())return;let a=this.ctx,o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}pick(){this.tone(430,.05,'triangle',.035)}place(){this.tone(150,.07,'sine',.06);this.tone(250,.05,'triangle',.03,.03)}merge(n=1){for(let i=0;i<Math.min(n,5);i++)this.tone(330+i*55,.08,'triangle',.035,i*.025)}clear(combo){this.tone(160,.16,'sawtooth',.04);this.tone(520+combo*45,.25,'triangle',.07,.04);this.tone(780+combo*65,.3,'sine',.05,.09)}}const A=new AudioFX;
function activeColors(){let set=[];for(let s of board)if(s.length&&!set.includes(top(s)))set.push(top(s));return set}
function makeTray(){let easy=(performance.now()-started)<180000,active=activeColors(),out=[];for(let k=0;k<3;k++){let n=easy?3+((Math.random()*3)|0):2+((Math.random()*3)|0);let t=(easy&&active.length&&Math.random()<.72)?active[(Math.random()*active.length)|0]:(Math.random()*TYPES.length)|0;let s=Array(n).fill(t);let mixChance=easy?.18:.38;if(n>=4&&Math.random()<mixChance){let under=(t+1+((Math.random()*(TYPES.length-1))|0))%TYPES.length;let underN=1+((Math.random()*Math.min(2,n-2))|0);for(let i=0;i<underN;i++)s[i]=under}out.push(s)}let sig=out.map(s=>s.join('')).join('|');if(sig===lastTray)return makeTray();lastTray=sig;return out}
function reset(){board=Array.from({length:30},()=>[]);score=0;selected=null;drag=null;busy=false;started=performance.now();lastTray='';tray=makeTray();particles=[];rings=[];shake=0;over.classList.remove('show');updateUI()}
function updateUI(combo=0){scoreEl.textContent=score.toLocaleString();bestEl.textContent=best.toLocaleString();comboEl.textContent=combo>1?'x'+combo:'—'}
function slotPos(i){return{x:bx+(i%5)*(cw+gap),y:by+((i/5)|0)*(ch+gap)}}function trayPos(i){return{x:205+i*245,y:ty}}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r)}
function cap(x,y,r,t,alpha=1){let q=TYPES[t];X.save();X.globalAlpha=alpha;X.shadowColor='#0006';X.shadowBlur=10;X.shadowOffsetY=6;let grad=X.createRadialGradient(x-r*.28,y-r*.35,r*.08,x,y,r);grad.addColorStop(0,q.l);grad.addColorStop(.6,q.b);grad.addColorStop(1,q.d);X.fillStyle=grad;X.beginPath();for(let i=0;i<32;i++){let a=i*Math.PI/16,rad=r*(i%2?1:.92),px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;if(i)X.lineTo(px,py);else X.moveTo(px,py)}X.closePath();X.fill();X.shadowColor='transparent';X.strokeStyle='#ffffff55';X.lineWidth=3;X.stroke();X.beginPath();X.arc(x,y,r*.72,0,Math.PI*2);X.strokeStyle='#ffffff35';X.lineWidth=4;X.stroke();X.fillStyle='white';X.textAlign='center';X.textBaseline='middle';X.font=`900 ${r*.34}px Arial`;X.shadowColor='#0007';X.shadowBlur=3;X.fillText(q.n,x,y+2);X.restore()}
function drawStack(s,x,y,scale=1,ghost=false){if(!s?.length)return;let r=49*scale,shown=Math.min(s.length,7),start=s.length-shown;for(let j=0;j<shown;j++){let idx=start+j,off=(shown-1-j)*8*scale;cap(x+off*.22,y+off,r,s[idx],ghost?.72:1)}let n=s.length;if(n>1){X.save();X.fillStyle='#2b2928dd';X.strokeStyle='#fff8';X.lineWidth=2;X.beginPath();X.arc(x+r*.65,y-r*.65,18*scale,0,Math.PI*2);X.fill();X.stroke();X.fillStyle='#fff';X.font=`800 ${19*scale}px Arial`;X.textAlign='center';X.textBaseline='middle';X.fillText(n,x+r*.65,y-r*.65+1);X.restore()}}
function render(){X.clearRect(0,0,W,H);X.save();if(shake){X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86;if(shake<.5)shake=0}X.fillStyle='#ead9c2';X.shadowColor='#5f402955';X.shadowBlur=25;X.shadowOffsetY=12;rr(bx-24,by-28,boardW+48,boardH+55,28);X.fill();X.shadowColor='transparent';for(let i=0;i<30;i++){let p=slotPos(i);X.fillStyle=i===hover&&!board[i].length?'#fff4d7':'#ddcbb5';rr(p.x,p.y,cw,ch,18);X.fill();X.strokeStyle='#b9a58f';X.lineWidth=3;X.stroke();if(board[i].length)drawStack(board[i],p.x+cw/2,p.y+ch/2-5,.92)}X.fillStyle='#303133';X.shadowColor='#0006';X.shadowBlur=18;rr(145,1295,650,205,28);X.fill();X.shadowColor='transparent';X.strokeStyle='#b8aa98';X.lineWidth=8;X.stroke();for(let i=0;i<3;i++){if(tray[i]&&!(drag&&drag.i===i)){let p=trayPos(i);drawStack(tray[i],p.x,p.y,1,selected===i)}}if(drag)drawStack(tray[drag.i],drag.x,drag.y,1.08,true);for(let p of particles){X.globalAlpha=Math.max(0,p.life);X.fillStyle=TYPES[p.t].l;X.beginPath();X.arc(p.x,p.y,p.r,0,Math.PI*2);X.fill();p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.life-=.025}particles=particles.filter(p=>p.life>0);for(let r of rings){X.globalAlpha=r.life;X.strokeStyle=TYPES[r.t].l;X.lineWidth=8*r.life;X.beginPath();X.arc(r.x,r.y,r.rad,0,Math.PI*2);X.stroke();r.rad+=7;r.life-=.045}rings=rings.filter(r=>r.life>0);X.restore();if(flash>0){X.fillStyle=`rgba(255,245,210,${flash})`;X.fillRect(0,0,W,H);flash*=.72}requestAnimationFrame(render)}
function burst(i,t,count=24){let p=slotPos(i),x=p.x+cw/2,y=p.y+ch/2;for(let k=0;k<count;k++){let a=Math.random()*Math.PI*2,s=3+Math.random()*9;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,r:3+Math.random()*6,life:1,t})}rings.push({x,y,rad:35,life:1,t});shake=Math.max(shake,15);flash=.22}
function showToast(text,combo=false){toast.textContent=text;toast.className='toast '+(combo?'combo ':'')+'show';void toast.offsetWidth;setTimeout(()=>toast.classList.remove('show'),900)}
async function resolve(start){busy=true;let queue=[start],combo=0;while(queue.length){let target=queue.shift();if(!board[target].length)continue;let changed=true;while(changed&&board[target].length){changed=false;for(let src of neigh(target)){if(!board[src].length||top(board[src])!==top(board[target]))continue;let n=run(board[src]),moved=board[src].splice(board[src].length-n,n);A.merge(n);await sleep(90);board[target].push(...moved);changed=true;if(board[src].length)queue.push(src)}let n=run(board[target]);if(n>=THRESH){let t=top(board[target]);combo++;await sleep(110);board[target].splice(board[target].length-n,n);let base=n*10,bonus=combo>1?Math.round(base*(combo-1)*.25):0;score+=base+bonus;if(score>best){best=score;localStorage.setItem('cap-best',best)}updateUI(combo);A.clear(combo);burst(target,t,24+Math.min(n,15));showToast(combo>1?`COMBO x${combo}  +${base+bonus}`:`CLEAR ${n}  +${base}`,combo>1);await sleep(480);if(board[target].length){queue.push(target);changed=true}}}}
updateUI(combo);busy=false;if(board.every(s=>s.length)){document.getElementById('final').textContent=`Score: ${score.toLocaleString()} • Best: ${best.toLocaleString()}`;over.classList.add('show')}}
async function place(ti,si){if(busy||!tray[ti]||board[si].length)return;board[si]=tray[ti].slice();tray[ti]=null;selected=null;A.place();await sleep(100);await resolve(si);if(tray.every(x=>!x))tray=makeTray()}
function point(e){let r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function trayHit(p){for(let i=0;i<3;i++){let q=trayPos(i);if(tray[i]&&Math.hypot(p.x-q.x,p.y-q.y)<80)return i}return-1}function slotHit(p){for(let i=0;i<30;i++){let q=slotPos(i);if(p.x>=q.x&&p.x<=q.x+cw&&p.y>=q.y&&p.y<=q.y+ch)return i}return-1}
C.addEventListener('pointerdown',e=>{if(busy)return;let p=point(e),i=trayHit(p);if(i>=0){A.pick();selected=i;drag={i,x:p.x,y:p.y,startX:p.x,startY:p.y,moved:false,id:e.pointerId};C.setPointerCapture?.(e.pointerId);e.preventDefault();return}let s=slotHit(p);if(selected!==null&&s>=0&&!board[s].length)place(selected,s)});
C.addEventListener('pointermove',e=>{if(!drag)return;let p=point(e);drag.x=p.x;drag.y=p.y;if(Math.hypot(p.x-drag.startX,p.y-drag.startY)>12)drag.moved=true;let s=slotHit(p);hover=s>=0&&!board[s].length?s:-1;e.preventDefault()});
C.addEventListener('pointerup',e=>{if(!drag)return;let p=point(e),d=drag,s=slotHit(p);drag=null;hover=-1;try{C.releasePointerCapture?.(e.pointerId)}catch{}if(d.moved&&s>=0&&!board[s].length)place(d.i,s);else selected=d.i;e.preventDefault()});C.addEventListener('pointercancel',()=>{drag=null;hover=-1});
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;localStorage.setItem('cap-sound',soundOn?'1':'0');document.getElementById('sound').textContent=soundOn?'♫':'×'};document.getElementById('again').onclick=reset;reset();render();
</script></body></html>
