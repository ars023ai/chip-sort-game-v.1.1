<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{min-height:100svh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 10%,#f8ead4,#d8c3a4 52%,#b9a282);font-family:Arial,Helvetica,sans-serif;color:var(--ink);user-select:none}.shell{position:relative;width:min(450px,calc((100svh - 32px)*.5625));aspect-ratio:9/16}.game{position:absolute;inset:0;overflow:hidden;border:1px solid #aa8e6a;border-radius:30px;background:linear-gradient(145deg,#f0e2cd,#dcc7a8);box-shadow:0 30px 90px #4d382955,0 1px 0 #fff inset}.game:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#76552b08 0 1px,transparent 1px 11px)}button{font:inherit}.hud{position:absolute;z-index:4;left:5.5%;right:5.5%;top:2.5%}.minirow{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:1.75cqw;letter-spacing:.14em;color:#705f4d}.kicker{display:flex;gap:1.1cqw;align-items:center}.kicker i,.flow i{display:block;width:1.3cqw;height:1.3cqw;border-radius:50%}.kicker i{background:#e88732}.flow{display:flex;align-items:center;gap:1cqw;padding:1.1cqw 2cqw;border:1px solid #aa9275;border-radius:999px;background:#f8edddc9;box-shadow:0 1px #fff inset}.flow i{background:#59b55d;box-shadow:0 0 0 .65cqw #59b55d22}.mainrow{display:flex;align-items:flex-end;justify-content:space-between;margin-top:2cqw}.logo{margin:0;font-weight:1000;color:var(--blue);font-size:7.8cqw;line-height:.82;letter-spacing:-.07em;text-shadow:0 1px #fff,0 2px #cdb995}.logo b{display:block;width:max-content;margin-top:1.25cqw;padding:.55cqw 2cqw .7cqw;border-radius:1.25cqw;background:var(--blue);color:var(--yellow);box-shadow:0 .65cqw var(--blue2);font-size:5.9cqw;letter-spacing:.02em;transform:rotate(-1.5deg)}.score{min-width:25.5cqw;padding:1.9cqw 2.7cqw;border:1px solid #131414;border-radius:3cqw;background:linear-gradient(#3b3d3e,#232526);box-shadow:0 .7cqw #1118,0 1px #ffffff26 inset;text-align:right;color:#fff}.score small{display:block;color:#d0cbc4;font-size:1.55cqw;font-weight:900;letter-spacing:.15em}.score strong{display:block;color:#ffd64c;font-size:6.5cqw;line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 2px #70520f}.score.bump{animation:bump .32s ease}.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1.35fr;gap:1.15cqw;margin-top:3cqw}.stat{padding:1.05cqw 1.45cqw;border:1px solid #b29a7c;border-radius:2cqw;background:#f7ebdacc;box-shadow:0 1px #fff inset}.stat small{display:block;color:#89745d;font-size:1.25cqw;font-weight:900;letter-spacing:.12em}.stat strong{display:block;margin-top:.45cqw;font-size:2.4cqw;font-variant-numeric:tabular-nums}.stat.combo strong{color:#cf661d}.stat:last-child{text-align:right}.board-wrap{position:absolute;z-index:2;left:5.2%;right:5.2%;top:22.15%;height:48.9%;padding:2.1%;border:1px solid #b39774;border-radius:4cqw;background:linear-gradient(#f7ecdd,#dbc3a2);box-shadow:0 2cqw 4cqw #694d2d31,0 1px #fff inset}.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,1fr);gap:1.25cqw}.cell{position:relative;border:1px solid #baa17f;border-radius:2.8cqw;background:linear-gradient(#dbc5a6,#f0e2cf);box-shadow:inset 0 .55cqw 1.1cqw #80674620,inset 0 -1px #fff;overflow:visible}.cell.empty:after{content:"+";position:absolute;inset:0;display:grid;place-items:center;color:#9e8568;font-weight:400;font-size:3.8cqw;opacity:.46}.cell.target{border-color:#e7a933;box-shadow:inset 0 0 0 .35cqw #f3bd52aa,0 0 0 .5cqw #f3bd5224}.cell.bad{animation:nope .35s ease;border-color:#d75c4b}.caption{position:absolute;z-index:4;left:7%;right:7%;top:72.35%;display:flex;justify-content:space-between;align-items:center;color:#786856;font-size:2cqw}.caption b{color:#8b4f20}.dots{display:flex;gap:.9cqw}.dots i{width:1.7cqw;height:1.7cqw;border-radius:50%;border:.15cqw solid #fff8;box-shadow:0 1px 2px #0003}.tray-title{position:absolute;z-index:4;left:7%;right:7%;top:77.1%;display:flex;justify-content:space-between;color:#554636;font-size:2cqw}.tray-title strong{letter-spacing:.16em}.tray-title span{color:#806f5c}.tray{position:absolute;z-index:2;left:5.4%;right:5.4%;top:80.4%;height:10.4%;display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw;padding:1.2cqw 1.5cqw;border:1px solid #9e8a74;border-radius:3.4cqw;background:linear-gradient(#56595a 0 8%,#313334 9%,#1f2122 100%);box-shadow:0 1.2cqw 2.2cqw #5b412b3d,0 1px #ffffff36 inset}.tray-slot{position:relative;display:grid;place-items:center;border-radius:2.6cqw;background:radial-gradient(ellipse,#191b1c 45%,#252728 65%,#4d4e4c 67%,transparent 70%)}.tray-slot.sel{box-shadow:inset 0 0 0 .45cqw #f0bd4d}.tray-num{position:absolute;right:1.2cqw;bottom:.7cqw;color:#aaa59e;font-size:1.6cqw;font-weight:900}.foot{position:absolute;z-index:4;left:6.5%;right:6.5%;bottom:2.15%;display:flex;align-items:center;justify-content:space-between;gap:2cqw}.icons{display:flex;gap:1.4cqw}.icon{width:7.8cqw;height:7.8cqw;display:grid;place-items:center;border:1px solid #786754;border-radius:50%;background:#f2e4d1;box-shadow:0 .55cqw #9e8567;color:#4d4135;font-weight:900;font-size:3.2cqw;cursor:pointer}.icon:active{transform:translateY(.4cqw);box-shadow:0 .1cqw #9e8567}.hint{text-align:center;color:#796b5b;font-size:1.85cqw;line-height:1.5}.hint b{color:#4f4337}.stack{position:absolute;left:50%;top:50%;width:12.5cqw;height:12.5cqw;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 1.1cqw 1cqw #5438173a)}.tray-slot .stack{width:13.5cqw;height:13.5cqw}.cap{--c:#888;--d:#555;position:absolute;left:50%;top:50%;width:100%;height:100%;border-radius:50%;transform:translate(-50%,-50%);background:repeating-conic-gradient(#ffffff40 0 5deg,#0000 5deg 11deg),radial-gradient(circle at 35% 28%,#ffffff62 0 8%,transparent 9%),radial-gradient(circle at 50% 47%,var(--c) 0 64%,var(--d) 65% 76%,#f1e8dc 77% 79%,var(--d) 80% 100%);box-shadow:inset 0 0 0 .45cqw #ffffff2a,0 .6cqw 0 -.18cqw var(--d);display:grid;place-items:center;color:#fff;text-shadow:0 .16cqw .25cqw #0008;font-weight:1000;font-size:2.05cqw;letter-spacing:-.06em}.cap.face{z-index:20}.cap .mark{max-width:74%;text-align:center;line-height:.88;transform:rotate(-4deg)}.count{position:absolute;z-index:40;right:-2.6cqw;top:-1.2cqw;min-width:5cqw;height:4.2cqw;padding:0 1cqw;display:grid;place-items:center;border-radius:999px;border:.25cqw solid #ffffffbb;background:#262626;color:#fff;font-size:2cqw;font-weight:1000;box-shadow:0 .45cqw .8cqw #0004}.count.ready{background:#ffd451;color:#44320a}.ring{position:absolute;z-index:35;inset:-.8cqw;border-radius:50%;background:conic-gradient(#ffd14d var(--p),#ffffff28 0);-webkit-mask:radial-gradient(transparent 0 72%,#000 73% 100%);mask:radial-gradient(transparent 0 72%,#000 73% 100%)}.ghost{position:fixed;z-index:50;width:62px;height:62px;pointer-events:none;transform:translate(-50%,-65%) scale(1.08);opacity:.94}.clear-pop{position:absolute;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:1000;color:#17477e;background:#ffd557;border:2px solid #fff4bb;border-radius:999px;padding:1.2cqw 2.3cqw;font-size:2.7cqw;box-shadow:0 .8cqw 2cqw #6b4a223f;animation:pop .75s ease forwards;pointer-events:none;white-space:nowrap}.modal-layer{position:absolute;z-index:100;inset:0;display:grid;place-items:center;padding:7%;background:#2b241cad;backdrop-filter:blur(8px)}.modal-layer[hidden]{display:none}.modal{width:100%;max-height:86%;overflow:auto;padding:6cqw;border:1px solid #9c7f5d;border-radius:5cqw;background:linear-gradient(145deg,#fff7eb,#ead4b8);box-shadow:0 18px 70px #2b1a0d66}.modal small{color:#9a5520;font-weight:900;letter-spacing:.16em}.modal h2{margin:2cqw 0 3cqw;color:#17477e;font-size:7.5cqw;line-height:1}.modal p,.modal li{color:#665747;font-size:2.7cqw;line-height:1.5}.modal ol{padding-left:5cqw}.primary,.secondary{width:100%;padding:3.2cqw;border-radius:2.5cqw;font-size:2.8cqw;font-weight:900;cursor:pointer}.primary{border:0;background:linear-gradient(#ffdb69,#efb926);color:#173250;box-shadow:0 .6cqw #a87310}.secondary{margin-top:2cqw;border:1px solid #9d8061;background:#f5e7d5;color:#554638}.result{text-align:center;padding:3cqw;border:1px solid #b89c79;border-radius:3cqw;background:#f8ead8}.result strong{display:block;color:#17477e;font-size:12cqw}.outside{position:absolute;top:calc(100% + 8px);width:100%;text-align:center;color:#6f6254;font-size:9px;letter-spacing:.14em}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes bump{50%{transform:scale(1.07)}}@keyframes nope{35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}20%{opacity:1;transform:translate(-50%,-55%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-110%) scale(.95)}}
@media(max-width:480px){body{padding:0}.shell{width:min(100vw,calc(100svh*.5625))}.game{border-radius:0;border-left:0;border-right:0}.outside{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}}

<body>
<main class="shell">
<section class="game" id="game" aria-label="Cap Stack Sort game">
<header class="hud">
 <div class="minirow"><div class="kicker"><i></i>BOTTLE CAP PUZZLE</div><div class="flow"><i></i><span id="flow">EASY FLOW</span></div></div>
 <div class="mainrow"><h1 class="logo">CAP STACK<b>SORT</b></h1><div class="score" id="scoreCard"><small>★ SCORE</small><strong id="score">0</strong></div></div>
 <div class="stats"><div class="stat"><small>BEST</small><strong id="best">0</strong></div><div class="stat combo"><small>COMBO</small><strong id="combo">—</strong></div><div class="stat"><small>TIME</small><strong id="time">00:00</strong></div><div class="stat"><small>OPEN</small><strong><span id="open">30</span> / 30</strong></div></div>
</header>
<div class="board-wrap"><div class="board" id="board" role="grid" aria-label="5 by 6 cap board"></div></div>
<div class="caption"><span><b>10+ same caps clear together</b> · lower layers stay</span><span class="dots" aria-hidden="true"><i style="background:#2e73df"></i><i style="background:#e64851"></i><i style="background:#ef8a18"></i><i style="background:#22aaa8"></i><i style="background:#7e50be"></i><i style="background:#9abb23"></i></span></div>
<div class="tray-title"><strong>NEXT STACKS</strong><span id="trayText">3 stacks to play</span></div>
<div class="tray" id="tray"></div>
<footer class="foot"><div class="icons"><button class="icon" id="sound" aria-label="Toggle sound">♪</button><button class="icon" id="help" aria-label="How to play">?</button></div><div class="hint" id="hint">Same caps. Bigger combos.<br><b>Drag a stack. Build a chain.</b></div><button class="icon" id="restart" aria-label="Restart">↻</button></footer>
<div class="modal-layer" id="modalLayer" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="sr" id="live" aria-live="polite"></div>
</section>
<div class="outside">PLAY · RELAX · REPEAT</div>
</main>
<script>
'use strict';
const TYPES=[
 {name:'Red Dull',mark:'RED\nDULL',c:'#3272e5',d:'#15429b'},
 {name:'Bepis',mark:'bepis',c:'#e64253',d:'#982435'},
 {name:'Fonta',mark:'fonta',c:'#f38a18',d:'#ad4f0c'},
 {name:'LessTea',mark:'LessTea',c:'#20aaa8',d:'#08706e'},
 {name:'Pep-Up',mark:'PEP-UP',c:'#7844c4',d:'#432170'},
 {name:'7-UPward',mark:'7 UP',c:'#a9c52d',d:'#658114'}
];
class Rules{
 static neighbors(i){const x=i%5,y=(i/5)|0,n=[];if(y)n.push(i-5);if(x)n.push(i-1);if(x<4)n.push(i+1);if(y<5)n.push(i+5);return n}
 static run(s){if(!s.length)return 0;const t=s[s.length-1];let i=s.length-1;while(i>=0&&s[i]===t)i--;return s.length-1-i}
 static empty(b){return b.reduce((n,s)=>n+(s.length===0),0)}
 static *resolve(b,start){const q=[start],pending=new Set(q),add=i=>{if(b[i].length&&!pending.has(i)){q.push(i);pending.add(i)}};while(q.length){const to=q.shift();pending.delete(to);if(!b[to].length)continue;for(const from of this.neighbors(to)){const a=b[to],s=b[from];if(!s.length||s[s.length-1]!==a[a.length-1])continue;const n=this.run(s),chips=s.splice(s.length-n,n);a.push(...chips);yield{type:'merge',from,to,chips};if(s.length)add(from)}const s=b[to],n=this.run(s);if(n>=10){const brand=s[s.length-1],chips=s.splice(s.length-n,n);yield{type:'clear',at:to,brand,count:n,chips,points:n*10};if(s.length)add(to)}}}
}
window.CapRules=Rules;
const $=id=>document.getElementById(id),boardEl=$('board'),trayEl=$('tray'),live=$('live');
const game={board:Array.from({length:30},()=>[]),tray:[],prev:[],selected:-1,score:0,best:0,combo:0,moves:0,busy:false,over:false,start:performance.now(),sound:true,drag:null};
try{game.best=+localStorage.getItem('cap-stack-best')||0;game.sound=localStorage.getItem('cap-stack-sound')!=='off'}catch{}
const sleep=ms=>new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion:reduce)').matches?10:ms));
function announce(s){live.textContent=s}
function beep(kind){if(!game.sound)return;try{const A=window.AudioContext||window.webkitAudioContext,ac=beep.ac||(beep.ac=new A),o=ac.createOscillator(),g=ac.createGain();o.type=kind==='clear'?'triangle':'sine';o.frequency.value=kind==='clear'?620:kind==='merge'?420:280;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(kind==='clear'?.08:.035,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.12);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.13)}catch{}}
function signature(t){return t.map(s=>s.join('')).join('|')}
function makeTray(){const elapsed=performance.now()-game.start,easy=elapsed<180000,very=elapsed<60000,palette=[0,1,5,2,3,4].slice(0,very?3:easy?4:6),tops=game.board.filter(s=>s.length).map(s=>s[s.length-1]).filter(x=>palette.includes(x)),weighted=[];for(const x of tops)weighted.push(x);let out=[];for(let attempt=0;attempt<16;attempt++){out=Array.from({length:3},(_,slot)=>{const n=(easy?3:2)+((Math.random()*3)|0);let top=easy&&weighted.length&&Math.random()<(very?.90:.84)?weighted[(Math.random()*weighted.length)|0]:palette[(Math.random()*palette.length)|0];if(!tops.length&&slot&&out.some(s=>s?.at(-1)===top))top=palette[(palette.indexOf(top)+slot)%palette.length];const s=Array(n).fill(top),chance=very?.08:easy?.16:.32;if(n>=3&&Math.random()<chance){const a=palette.filter(x=>x!==top),under=a[(Math.random()*a.length)|0],buried=1+((Math.random()*Math.min(2,n-2))|0);for(let i=0;i<buried;i++)s[i]=under}return s});if(new Set(out.map(s=>s.at(-1))).size>1&&signature(out)!==signature(game.prev))break}game.prev=out.map(s=>s.slice());return out}
function visible(s){if(s.length<=7)return s.map((_,i)=>i);return Array.from({length:7},(_,i)=>Math.round(i*(s.length-1)/6))}
function stackHTML(s){if(!s?.length)return'';const ids=visible(s),run=Rules.run(s),caps=ids.map((idx,j)=>{const t=TYPES[s[idx]],f=ids.length===1?1:j/(ids.length-1),x=(-f*9).toFixed(1),y=(-f*17).toFixed(1),face=j===ids.length-1?' face':'',label=j===ids.length-1?`<span class="mark">${t.mark.replace('\n','<br>')}</span>`:'';return`<span class="cap${face}" style="--c:${t.c};--d:${t.d};transform:translate(calc(-50% + ${x}px),calc(-50% + ${y}px))">${label}</span>`}).join('');return`<span class="stack">${caps}<i class="ring" style="--p:${Math.min(100,run*10)}%"></i><b class="count${run>=10?' ready':''}">${s.length}</b></span>`}
function render(){boardEl.innerHTML=game.board.map((s,i)=>`<button class="cell${s.length?'':' empty'}" data-cell="${i}" role="gridcell" aria-label="${s.length?`${s.length} caps, ${TYPES[s.at(-1)].name} on top`:'Empty slot'}">${stackHTML(s)}</button>`).join('');trayEl.innerHTML=game.tray.map((s,i)=>`<div class="tray-slot${game.selected===i?' sel':''}" data-tray="${i}">${s?stackHTML(s):''}<span class="tray-num">${i+1}</span></div>`).join('');$('score').textContent=game.score.toLocaleString();$('best').textContent=game.best.toLocaleString();$('combo').textContent=game.combo>1?'x'+game.combo:'—';$('open').textContent=Rules.empty(game.board);const left=game.tray.filter(Boolean).length;$('trayText').textContent=`${left} stack${left===1?'':'s'} to play`;$('hint').innerHTML=game.busy?'Caps are finding their color.<br><b>Watch the chain…</b>':game.selected>=0?'Pick any empty coaster.<br><b>Tap to place · Esc to cancel</b>':'Same caps. Bigger combos.<br><b>Drag a stack. Build a chain.</b>'}
function select(i){if(game.busy||game.over||!game.tray[i])return;game.selected=i;beep('pick');render();announce(`Stack ${i+1}: ${game.tray[i].length} caps. ${TYPES[game.tray[i].at(-1)].name} on top.`)}
function pop(cell,text){const el=boardEl.children[cell],p=document.createElement('span');p.className='clear-pop';p.textContent=text;el.appendChild(p);setTimeout(()=>p.remove(),800)}
async function place(cell){if(game.busy||game.over||game.selected<0)return false;if(game.board[cell].length){const el=boardEl.children[cell];el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),400);beep('bad');return false}const ti=game.selected,s=game.tray[ti];game.board[cell]=s.slice();game.tray[ti]=null;game.selected=-1;game.busy=true;game.combo=0;game.moves++;render();beep('place');await sleep(130);for(const ev of Rules.resolve(game.board,cell)){if(ev.type==='merge'){render();beep('merge');await sleep(150)}else{game.combo++;const bonus=Math.min(100,(game.combo-1)*25),award=ev.points+bonus;game.score+=award;game.best=Math.max(game.best,game.score);try{localStorage.setItem('cap-stack-best',game.best)}catch{}render();pop(ev.at,`+${award}${game.combo>1?' · COMBO x'+game.combo:''}`);$('scoreCard').classList.remove('bump');void $('scoreCard').offsetWidth;$('scoreCard').classList.add('bump');beep('clear');await sleep(260)}}if(game.tray.every(x=>!x)){game.tray=makeTray();beep('merge')}game.busy=false;game.over=Rules.empty(game.board)===0;render();announce(`${game.combo?game.combo+' clears. ':''}Score ${game.score}. ${Rules.empty(game.board)} open slots.`);if(game.over)openModal('over');return true}
function newGame(){game.board=Array.from({length:30},()=>[]);game.start=performance.now();game.prev=[];game.tray=[];game.selected=-1;game.score=0;game.combo=0;game.moves=0;game.busy=false;game.over=false;game.tray=makeTray();closeModal();render();announce('New game. Thirty open slots.')}
boardEl.addEventListener('click',e=>{const c=e.target.closest('.cell');if(c&&game.selected>=0)place(+c.dataset.cell)});trayEl.addEventListener('click',e=>{const t=e.target.closest('.tray-slot');if(t)select(+t.dataset.tray)});
function ghostFor(stack,x,y){const g=document.createElement('div');g.className='ghost';g.innerHTML=stackHTML(stack);document.body.appendChild(g);moveGhost(g,x,y);return g}function moveGhost(g,x,y){g.style.left=x+'px';g.style.top=y+'px'}
trayEl.addEventListener('pointerdown',e=>{if(game.busy||game.over||e.button!==0)return;const t=e.target.closest('.tray-slot');if(!t)return;const i=+t.dataset.tray;if(!game.tray[i])return;select(i);game.drag={id:e.pointerId,i,x:e.clientX,y:e.clientY,moved:false,ghost:null};t.setPointerCapture?.(e.pointerId)});
trayEl.addEventListener('pointermove',e=>{const d=game.drag;if(!d||d.id!==e.pointerId)return;if(!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>7){d.moved=true;d.ghost=ghostFor(game.tray[d.i],e.clientX,e.clientY)}if(d.ghost)moveGhost(d.ghost,e.clientX,e.clientY);document.querySelectorAll('.cell.target').forEach(x=>x.classList.remove('target'));const c=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(c&&!game.board[+c.dataset.cell].length)c.classList.add('target')});
trayEl.addEventListener('pointerup',e=>{const d=game.drag;if(!d||d.id!==e.pointerId)return;d.ghost?.remove();document.querySelectorAll('.cell.target').forEach(x=>x.classList.remove('target'));if(d.moved){const c=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(c)place(+c.dataset.cell)}game.drag=null});trayEl.addEventListener('pointercancel',()=>{game.drag?.ghost?.remove();game.drag=null});
function openModal(type){const m=$('modal');$('modalLayer').hidden=false;if(type==='help')m.innerHTML='<small>SAME CAPS. BIGGER COMBOS.</small><h2>Stack the color.</h2><ol><li><b>Easy flow.</b> For the first three minutes the game uses fewer colors and strongly favors useful caps.</li><li><b>Drag or tap.</b> Put one of the three tray stacks into any empty cell.</li><li><b>Merge.</b> Matching top colors from the four neighboring cells move into the active stack.</li><li><b>Clear.</b> When the top group reaches 10 or more, that whole matching group disappears. 13 clears 13; 15 clears 15.</li><li><b>Chain.</b> Buried colors remain visible. When a clear exposes another color, it can immediately merge again and create a combo.</li></ol><p>A full board after all reactions finish is game over.</p><button class="primary" data-close>Got it</button>';else if(type==='restart')m.innerHTML='<small>A CLEAN SLATE</small><h2>Start fresh?</h2><p>Your board and score will reset. Your best stays.</p><button class="primary" data-new>Yes, new game</button><button class="secondary" data-close>Keep playing</button>';else m.innerHTML=`<small>GAME OVER</small><h2>All stacked up.</h2><div class="result"><span>FINAL SCORE</span><strong>${game.score.toLocaleString()}</strong><span>BEST ${game.best.toLocaleString()} · ${game.moves} MOVES</span></div><button class="primary" data-new>Play again</button>`}
function closeModal(){$('modalLayer').hidden=true}$('modalLayer').addEventListener('click',e=>{if(e.target.hasAttribute('data-close')||e.target===$('modalLayer'))closeModal();if(e.target.hasAttribute('data-new'))newGame()});$('help').onclick=()=>openModal('help');$('restart').onclick=()=>openModal('restart');$('sound').onclick=()=>{game.sound=!game.sound;try{localStorage.setItem('cap-stack-sound',game.sound?'on':'off')}catch{};$('sound').textContent=game.sound?'♪':'×'};
document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='3')select(+e.key-1);else if(e.key==='Escape'){game.selected=-1;closeModal();render()}else if(e.key.toLowerCase()==='h')openModal('help');else if(e.key.toLowerCase()==='r')openModal('restart')});
let lastSec=-1;function tick(){const sec=Math.max(0,((performance.now()-game.start)/1000)|0);if(sec!==lastSec){lastSec=sec;$('time').textContent=String((sec/60)|0).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');$('flow').textContent=sec<180?'EASY FLOW':'OPEN FLOW'}requestAnimationFrame(tick)}
newGame();$('sound').textContent=game.sound?'♪':'×';requestAnimationFrame(tick);
</script>
</body>
</html>
