name: Game regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/rules.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile controls
        run: |
          python3 -m http.server 8765 > /tmp/caps-server.log 2>&1 &
          node tests/regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-screenshots
          path: /tmp/caps-*.png
